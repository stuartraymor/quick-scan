<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The page never zooms: on a phone a pinch belongs to the 3D viewport,
         and a page zoomed by one left the instrument stuck in a corner of
         the window. maximum-scale also keeps iOS from zooming in on a
         focused field and staying there. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Quick Scan</title>
    <meta
      name="description"
      content="Quick Scan — local desktop reverse engineering, based on ScanRuler by CNC Kitchen: analyze 3D scans in your browser: fit spheres, cylinders and planes, measure dimensions, map deviation from CAD and wall thickness. Everything stays local."
    />
    <!-- The tab icon is the logo's mark, simplified for 16 px; the .ico is
         for browsers that take no SVG. The full logo set is in docs/brand. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48" />
    <link rel="preload" href="/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/b612-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* pre-CSS paint: chassis gray instead of a white flash — and the dark
         chassis where that is what was chosen (the same key the settings
         store keeps it under; the figures match --chassis in styles.css). */
      html { background: #e7e6e1; }
      html[data-theme='dark'] { background: #1b1d20; }
    </style>
    <script>
      try {
        var t = localStorage.getItem('scanruler.uitheme')
        if (t === null || t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="startup-status" role="status" style="position:fixed;inset:0;z-index:2147483647;display:grid;place-content:center;background:#1b1d20;color:#eee;font:16px system-ui;text-align:center;padding:24px">
      <p>Opening Quick Scan...</p>
    </div>
    <script>
      (function () {
        function failed() {
          if (document.documentElement.dataset.appReady === 'true') return
          var status = document.getElementById('startup-status')
          if (status) {
            status.innerHTML = '<p>Quick Scan could not finish opening.</p><p>Close Quick Scan and open it again.</p>'
          }
          if (window.quickScanStartup) window.quickScanStartup.error()
        }
        addEventListener('error', function (event) {
          if (event.target === window || event.target instanceof HTMLScriptElement) failed()
        }, true)
        addEventListener('unhandledrejection', failed)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
